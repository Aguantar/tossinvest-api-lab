version: 2
models:
  - name: stg_candles_1m
    description: "한 행 = 종목 × 1분봉. ts 는 봉 종료 시각. session 은 KST 봉 시각으로 pre/regular/after."
    columns:
      - name: session
        tests: [{accepted_values: {arguments: {values: ['pre', 'regular', 'after']}}}]
  - name: stg_stock_info
    description: "한 행 = 스냅샷일 × 종목."
    columns:
      - name: status
        tests: [{accepted_values: {arguments: {values: ['ACTIVE', 'SCHEDULED', 'DELISTED']}}}]
  - name: dim_symbol_day_profile
    description: "한 행 = 거래일 × 종목. 관측 프로파일(720/660/390)과 종목 속성 기반 기대 프로파일."
    tests:
      - unique: {arguments: {column_name: "trade_date || '-' || symbol"}}
    columns:
      - name: profile_observed
        tests: [{accepted_values: {arguments: {values: [720, 660, 390]}}}]
  - name: dq_bars_daily
    description: "한 행 = 거래일. 빠짐없음 판정 집계."
    columns:
      - name: trade_date
        tests: [unique, not_null]
  - name: dq_intraday_vs_final_daily
    description: "한 행 = 거래일. 장중 표 대 완결본 셀 대조."
    columns:
      - name: trade_date
        tests: [unique, not_null]
  - name: dq_adjustment_changes_daily
    description: "한 행 = 스냅샷일 × 종목, 수정주가가 바뀐 종목만."
  - name: dq_trend_coverage_daily
    description: "한 행 = 거래일 × endpoint. 유니버스 대비 커버리지."
  - name: mart_market_daily
    description: "한 행 = 거래일. 시장 집계 (공개 가능)."
    columns:
      - name: trade_date
        tests: [unique, not_null]
  - name: mart_symbol_daily
    description: "한 행 = 거래일 × 종목 (내부용)."
    tests:
      - unique: {arguments: {column_name: "trade_date || '-' || symbol"}}
